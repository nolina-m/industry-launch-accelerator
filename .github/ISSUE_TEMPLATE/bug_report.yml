name: Bug
description: Something broke or behaved unexpectedly.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Please don't paste confidential material**: no product briefs, customer names, internal documents or access keys.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you ask the agent to do, and what did it do instead?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - Setup
        - Starting a launch
        - "0 Intake"
        - "1 Industry research"
        - "2 Competitive"
        - "3 Strategy check"
        - "4 Personas"
        - "5 Messaging"
        - "6 Sales assets (playbook, demo, web copy)"
        - "7 QA and packaging"
        - Refresh
        - Word / Excel / Google files
        - Data sources
        - Other
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Coding agent and version
      placeholder: e.g. Claude Code 2.x, Codex, Cursor
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error messages or command output
      description: Paste any error text (remove anything confidential).
      render: shell
