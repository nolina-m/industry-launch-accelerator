<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Industry Launch Accelerator: stages and checkpoints</title>
  <desc id="desc">Inputs go through intake, industry research and competitive analysis, a strategy check, personas, messaging and sales assets, then QA, producing the launch kit. The PMM approves, edits, redoes or cuts at a checkpoint after each stage. An on-demand refresh loops back to research and competitive.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/>
    </marker>
    <marker id="arrow-refresh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E86AB"/>
    </marker>
    <g id="checkpoint">
      <rect x="-9" y="-9" width="18" height="18" transform="rotate(45)" fill="#F2B705" stroke="#8A6A00" stroke-width="1.2"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1000" height="420" rx="14" fill="#FFFFFF"/>

  <!-- Row 1 -->
  <g font-size="15" text-anchor="middle" fill="#1A1A1A">
    <rect x="20" y="40" width="160" height="96" rx="10" fill="#F4F6F8" stroke="#5A6B7B" stroke-width="1.5"/>
    <text x="100" y="72" font-weight="bold">Your inputs</text>
    <text x="100" y="94" font-size="12.5">Product brief · POV</text>
    <text x="100" y="112" font-size="12.5">Industries · Brand</text>

    <rect x="220" y="40" width="160" height="96" rx="10" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="300" y="72" font-weight="bold">0 · Intake</text>
    <text x="300" y="94" font-size="12.5">Gap report and</text>
    <text x="300" y="112" font-size="12.5">specific questions</text>

    <rect x="420" y="40" width="160" height="44" rx="10" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="500" y="67" font-weight="bold">1 · Industry research</text>
    <rect x="420" y="92" width="160" height="44" rx="10" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="500" y="119" font-weight="bold">2 · Competitive</text>

    <rect x="620" y="40" width="160" height="96" rx="10" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="700" y="72" font-weight="bold">3 · Strategy check</text>
    <text x="700" y="94" font-size="12.5">Evidence-based view</text>
    <text x="700" y="112" font-size="12.5">on your POV</text>

    <rect x="820" y="40" width="160" height="96" rx="10" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="900" y="72" font-weight="bold">4 · Personas</text>
    <text x="900" y="94" font-size="12.5">and buying committee,</text>
    <text x="900" y="112" font-size="12.5">per industry</text>
  </g>

  <!-- Row 2 -->
  <g font-size="15" text-anchor="middle" fill="#1A1A1A">
    <rect x="20" y="250" width="160" height="96" rx="10" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="100" y="282" font-weight="bold">5 · Messaging</text>
    <text x="100" y="304" font-size="12.5">Positioning, pillars,</text>
    <text x="100" y="322" font-size="12.5">industry × persona</text>

    <rect x="220" y="250" width="160" height="96" rx="10" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="300" y="282" font-weight="bold">6 · Sales assets</text>
    <text x="300" y="304" font-size="12.5">Playbook · Demo story</text>
    <text x="300" y="322" font-size="12.5">Web copy brief</text>

    <rect x="420" y="250" width="160" height="96" rx="10" fill="#EAF1F8" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="500" y="282" font-weight="bold">7 · QA</text>
    <text x="500" y="304" font-size="12.5">Citations, brand,</text>
    <text x="500" y="322" font-size="12.5">sameness, gaps</text>

    <rect x="620" y="250" width="160" height="96" rx="10" fill="#1F4E79" stroke="#1F4E79" stroke-width="1.5"/>
    <text x="700" y="282" font-weight="bold" fill="#FFFFFF">Launch kit</text>
    <text x="700" y="304" font-size="12.5" fill="#FFFFFF">8 assets in Word,</text>
    <text x="700" y="322" font-size="12.5" fill="#FFFFFF">Excel and Markdown</text>

    <rect x="820" y="250" width="160" height="96" rx="10" fill="#FFFFFF" stroke="#2E86AB" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="900" y="282" font-weight="bold" fill="#2E86AB">Refresh</text>
    <text x="900" y="304" font-size="12.5">On demand: what</text>
    <text x="900" y="322" font-size="12.5">changed, and where</text>
  </g>

  <!-- Arrows, row 1 -->
  <g stroke="#1F4E79" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="88" x2="216" y2="88"/>
    <line x1="380" y1="88" x2="416" y2="62"/>
    <line x1="380" y1="88" x2="416" y2="114"/>
    <line x1="580" y1="62" x2="616" y2="88"/>
    <line x1="580" y1="114" x2="616" y2="88"/>
    <line x1="780" y1="88" x2="816" y2="88"/>
    <!-- wrap from Personas down to Messaging -->
    <path d="M900,136 L900,190 L100,190 L100,246"/>
    <!-- Row 2 -->
    <line x1="180" y1="298" x2="216" y2="298"/>
    <line x1="380" y1="298" x2="416" y2="298"/>
    <line x1="580" y1="298" x2="616" y2="298"/>
  </g>
  <!-- Refresh loop -->
  <g stroke="#2E86AB" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <line x1="780" y1="298" x2="816" y2="298" marker-end="url(#arrow-refresh)"/>
    <path d="M900,250 L900,222 L520,222 L520,142" marker-end="url(#arrow-refresh)"/>
  </g>
  <text x="712" y="216" font-size="12" fill="#2E86AB" text-anchor="middle">updates go back through the checkpoints</text>

  <!-- Checkpoints: after each stage -->
  <use href="#checkpoint" x="300" y="148"/>
  <use href="#checkpoint" x="600" y="148"/>
  <use href="#checkpoint" x="700" y="148"/>
  <use href="#checkpoint" x="900" y="160"/>
  <use href="#checkpoint" x="100" y="358"/>
  <use href="#checkpoint" x="300" y="358"/>
  <use href="#checkpoint" x="500" y="358"/>

  <!-- Legend -->
  <use href="#checkpoint" x="36" y="394"/>
  <text x="56" y="399" font-size="13" fill="#1A1A1A">PMM checkpoint after every stage: approve, edit, redo or cut. Every claim is cited or labeled [VERIFY] / [ASSUMPTION].</text>
</svg>
