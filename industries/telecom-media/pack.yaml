  - "advertising market outlook <year>"
typical_objections:
  - Our network and IT stack is too complex to change quickly
  - It must meet carrier-grade reliability
  - Regulatory approval or reporting could be affected
  - Our care centers are outsourced, so change is slow
  - We need proof at a provider of our size
vocabulary:
